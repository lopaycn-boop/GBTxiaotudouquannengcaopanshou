name: Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Import check
        run: |
          python -c "from potato.risk import RiskValidator; print('risk OK')"
          python -c "from potato.trading.journal import TradeJournal; print('journal OK')"
          python -c "from potato.trading.executor import TradeExecutor; print('executor OK')"
          python -c "from potato.vault import Vault; print('vault OK')"

  server-smoke:
    # Verify the production dependency set (requirements.server.txt, used by the
    # Docker image) can install and the server entrypoint imports cleanly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install production server dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.server.txt

      - name: App import check (server deps only)
        run: python -c "import app; print('app import OK')"

  docker-build:
    # Build the production image and smoke-test the /health endpoint so
    # Dockerfile-level regressions (e.g. wrong bind host) are caught in CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t potato-app:ci .

      - name: Run container and check health
        run: |
          docker run -d --name potato-ci -p 8080:8080 \
            -e VAULT_ENCRYPTION_KEY=ci-smoke-key \
            -e VAULT_SALT=ci-smoke-salt \
            potato-app:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then
              echo "health OK"; exit 0
            fi
            sleep 2
          done
          echo "health check failed"; docker logs potato-ci; exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f potato-ci || true

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Bandit static security scan (fail on high severity)
        run: bandit -r potato app.py -lll -iii

      - name: pip-audit dependency vulnerability scan (informational)
        continue-on-error: true
        run: pip-audit -r requirements.server.txt