[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GBTxiaotudouAI"
version = "1.21.1"
description = "🌱 GBTxiaotudou AI操盘 — 自动交易+全电脑操控+AI助手"
authors = [{name = "自由的风"}]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "openai>=1.3.8",
    "aiohttp>=3.9.0",
    "python-multipart>=0.0.6",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "psycopg2-binary>=2.9.9",
    "cryptography>=42.0.0",
    "edge-tts>=6.1.0",
    "chromadb>=0.4.14",
    "numpy>=1.24.0",
    "Pillow>=10.0",
    "qrcode>=7.4",
    "lark-oapi>=1.4.0",
    "slowapi>=0.1.9",
]

[tool.vercel]
entrypoint = "desktop_pet.backend.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["potato*", "desktop_pet.backend*"]
exclude = [
    "tests*",
    "desktop_pet.frontend*",
    "desktop_pet.electron*",
]
namespaces = true
